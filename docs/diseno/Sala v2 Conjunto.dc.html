<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<meta name="design_doc_mode" content="canvas">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>body{margin:0;background:#060B1F;color:#F3F6FF;font-family:Manrope,system-ui,sans-serif}a{color:#38B6FF;text-decoration:none}a:hover{color:#F3F6FF}</style>
</helmet>
<section style="padding:40px;display:flex;flex-direction:column;gap:20px">
  <div style="display:flex;align-items:baseline;gap:14px;flex-wrap:wrap"><span style="font-size:12px;letter-spacing:.28em;text-transform:uppercase;font-weight:700"><span style="color:#FF6A1A">·· ·</span> Sala · vista de conjunto</span><span style="font-size:13px;color:#9AA7C7">Diseñada en 1366×768 · sin scroll de página · anclas data-tutorial marcadas en naranja · <a href="Carta.dc.html">componente carta →</a></span></div>
  <div style="display:flex;gap:28px;align-items:flex-start;flex-wrap:wrap">
    <sc-for list="{{ estados }}" as="e" hint-placeholder-count="4">
      <div id="{{ e.id }}" style="display:flex;flex-direction:column;gap:10px;flex:none">
        <div style="display:flex;align-items:center;gap:10px"><a href="#{{ e.id }}" style="font-family:'JetBrains Mono',monospace;font-size:11px;padding:2px 8px;border:1px solid #24335E;border-radius:6px;color:#9AA7C7">{{ e.id }}</a><span style="font-weight:800;font-size:14px">{{ e.nombre }}</span><a href="{{ e.href }}" style="font-size:12px;margin-left:auto">abrir →</a></div>
        <div style="width:1366px;height:768px;border:1px solid #24335E;border-radius:14px;overflow:hidden;position:relative">
          <dc-import name="Sala v2" escena="{{ e.escena }}" vista="escritorio" anclas="{{ e.anclas }}" alto="768px" style="width:1366px;height:768px;display:block" hint-size="1366px,768px"></dc-import>
        </div>
      </div>
    </sc-for>
  </div>
  <div style="display:flex;gap:28px;align-items:flex-start;flex-wrap:wrap">
    <sc-for list="{{ moviles }}" as="e" hint-placeholder-count="2">
      <div id="{{ e.id }}" style="display:flex;flex-direction:column;gap:10px;flex:none">
        <div style="display:flex;align-items:center;gap:10px"><a href="#{{ e.id }}" style="font-family:'JetBrains Mono',monospace;font-size:11px;padding:2px 8px;border:1px solid #24335E;border-radius:6px;color:#9AA7C7">{{ e.id }}</a><span style="font-weight:800;font-size:14px">{{ e.nombre }}</span></div>
        <div style="width:390px;height:844px;border:1px solid #24335E;border-radius:14px;overflow:hidden;position:relative">
          <dc-import name="Sala v2" escena="{{ e.escena }}" vista="movil" anclas="{{ e.anclas }}" alto="844px" style="width:390px;height:844px;display:block" hint-size="390px,844px"></dc-import>
        </div>
      </div>
    </sc-for>
  </div>
</section>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  renderVals() {
    return {
      estados: [
        { id: '1a', nombre: 'Encargo (al entrar)', escena: 'encargo', anclas: false, href: 'Sala v2 Encargo.dc.html' },
        { id: '1b', nombre: 'Sala vacía · con anclas', escena: 'vacia', anclas: true, href: 'Sala v2 Vacia.dc.html' },
        { id: '1c', nombre: 'Mesa con trazos · uno sin tipo', escena: 'trazos', anclas: false, href: 'Sala v2 Trazos.dc.html' },
        { id: '1d', nombre: 'Veredicto · 19 × 2.4 = 46', escena: 'veredicto', anclas: false, href: 'Sala v2 Veredicto.dc.html' }
      ],
      moviles: [
        { id: '1e', nombre: 'Móvil 390×844 · trazos · con anclas', escena: 'trazos', anclas: true },
        { id: '1f', nombre: 'Móvil · veredicto', escena: 'veredicto', anclas: false }
      ]
    };
  }
}
</script>
</body>
</html>
