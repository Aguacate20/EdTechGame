<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0A1230 radial-gradient(ellipse 90% 60% at 50% 0%,#12204A,#0A1230 70%);color:#F3F6FF;font-family:Manrope,system-ui,sans-serif;-webkit-font-smoothing:antialiased;min-height:100vh}
body::before{content:"";position:fixed;inset:0;pointer-events:none;background-image:radial-gradient(1px 1px at 22px 31px,rgba(243,246,255,.6),transparent),radial-gradient(1px 1px at 140px 88px,rgba(243,246,255,.4),transparent),radial-gradient(1.5px 1.5px at 210px 190px,rgba(243,246,255,.5),transparent),radial-gradient(1px 1px at 70px 230px,rgba(243,246,255,.35),transparent),radial-gradient(1px 1px at 250px 40px,rgba(56,182,255,.5),transparent);background-size:280px 280px}
a{color:#38B6FF;text-decoration:none}a:hover{color:#F3F6FF}
:focus-visible{outline:2px solid #FF6A1A;outline-offset:2px;border-radius:6px}
input::placeholder{color:#6F7DA3}
button,input{font-family:inherit}
</style>
</helmet>

<div data-screen-label="Entrar" style="min-height:100vh;display:grid;place-items:center;padding:24px;box-sizing:border-box;position:relative">
  <div style="position:absolute;inset:0;opacity:.55;pointer-events:none">
    <x-import component-from-global-scope="LcGalaxia" from="./galaxia.js" modo="vivo" style="position:absolute;inset:0" hint-size="100%,100%"></x-import>
  </div>
  <form onSubmit="{{ enviar }}" style="position:relative;width:100%;max-width:420px;background:#15224A;border:1px solid #24335E;border-radius:12px;padding:28px;box-sizing:border-box;display:flex;flex-direction:column;gap:18px">
    <div style="display:flex;align-items:center;gap:10px">
      <span style="width:34px;height:34px;border-radius:50%;border:1.5px solid #38B6FF;display:grid;place-items:center;position:relative"><span style="width:10px;height:10px;border-radius:50%;background:#FF6A1A;box-shadow:0 0 12px #FF6A1A"></span><span style="position:absolute;top:-3px;right:4px;width:5px;height:5px;border-radius:50%;background:#FFC23D"></span></span>
      <span style="display:flex;flex-direction:column;line-height:1"><span style="font-weight:800;font-size:20px">Ludus<span style="color:#FF6A1A">Cog</span></span><span style="font-size:9px;letter-spacing:.18em;color:#9AA7C7;text-transform:uppercase;margin-top:3px">aprender · entender · avanzar</span></span>
    </div>
    <h1 style="margin:0;font-size:24px;font-weight:800;line-height:1.25;text-wrap:pretty">Tu galaxia de conocimiento empieza con un nombre.</h1>
    <label style="display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600;color:#9AA7C7">Nombre
      <input value="{{ nombre }}" onChange="{{ setNombre }}" placeholder="Cómo quieres que te llame Andy" style="padding:12px 14px;border-radius:10px;border:1px solid #24335E;background:#0F1A3C;color:#F3F6FF;font-size:15px;min-height:44px;box-sizing:border-box" />
    </label>
    <label style="display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600;color:#9AA7C7">Código del campo
      <input value="{{ codigo }}" onChange="{{ setCodigo }}" placeholder="LJH7K2" maxLength="6" aria-invalid="{{ error }}" style="padding:12px 14px;border-radius:10px;border:1px solid {{ bordeCodigo }};background:#0F1A3C;color:#F3F6FF;font-size:18px;letter-spacing:.3em;text-transform:uppercase;font-family:'JetBrains Mono',monospace;min-height:44px;box-sizing:border-box" />
      <sc-if value="{{ error }}" hint-placeholder-val="{{ false }}">
        <span role="alert" style="font-size:13px;font-weight:500;color:#FF8A8A;line-height:1.4">No hay un campo con ese código. Pídeselo a tu profesor.</span>
      </sc-if>
      <sc-if value="{{ sinError }}" hint-placeholder-val="{{ true }}">
        <span style="font-size:12px;font-weight:500;color:#9AA7C7">6 caracteres. Te lo da tu profesor.</span>
      </sc-if>
    </label>
    <button type="submit" style="padding:16px;border:0;border-radius:12px;background:#FF6A1A;color:#0A1230;font-size:17px;font-weight:800;min-height:48px;cursor:pointer" style-hover="background:#FF7E3A">Entrar al campo</button>
    <a href="#" onClick="{{ tengoCodigo }}" style="text-align:center;font-size:13px;font-weight:600">Ya tengo un código de jugador</a>
  </form>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;mostrarError&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Estado&quot;}}">
class Component extends DCLogic {
  state = { nombre: '', codigo: '', error: false };
  renderVals() {
    const forzado = this.props.mostrarError ?? false;
    const error = forzado || this.state.error;
    return {
      nombre: this.state.nombre, codigo: this.state.codigo, error, sinError: !error,
      bordeCodigo: error ? '#FF5A5A' : '#24335E',
      setNombre: e => this.setState({ nombre: e.target.value }),
      setCodigo: e => this.setState({ codigo: e.target.value.toUpperCase(), error: false }),
      enviar: e => { e.preventDefault(); if (this.state.codigo === 'LJH7K2') location.href = 'Inicio.dc.html'; else this.setState({ error: true }); },
      tengoCodigo: e => e.preventDefault()
    };
  }
}
</script>
</body>
</html>
